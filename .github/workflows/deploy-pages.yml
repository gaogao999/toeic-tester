name: Deploy to GitHub Pages

# main に push されたときに、リポジトリの中身をそのまま GitHub Pages へ公開する。
# ビルド工程がない静的サイトなので、チェックアウトしたものをそのままアップロードしている。
on:
  push:
    branches: [main]
  workflow_dispatch: # 画面から手動でも実行できるようにしておく

permissions:
  contents: read
  pages: write
  id-token: write

# 同時に走らせない。進行中のデプロイは中断せず、完了を待つ
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pages の設定
        uses: actions/configure-pages@v5
        with:
          # Pages が未設定でも、この実行で有効化する
          enablement: true

      - name: 公開する内容をまとめる
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: 公開する
        id: deployment
        uses: actions/deploy-pages@v4
