<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>英単語プリント</title>
<link rel="stylesheet" href="css/style.css" />
<link rel="icon" href="icons/icon-180.png" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
</head>
<body>

<!--
  画面はこれだけ。**左が設定、右が紙。**
  右に見えているものが、そのまま印刷される（プレビュー用に別の組み方をしない）。
-->
<div class="layout">

  <aside class="controls" id="controls">
    <h1 class="app-title">英単語プリント</h1>

    <label class="field">
      <span>用紙</span>
      <select id="f-sheet">
        <option value="list">おぼえる用（一覧）</option>
        <option value="ja2en">テスト　意味 → 英語</option>
        <option value="en2ja">テスト　英語 → 意味</option>
        <option value="write">書いて覚える</option>
      </select>
    </label>

    <label class="field">
      <span>レベル</span>
      <select id="f-level">
        <option value="all">すべて</option>
        <option value="2">基礎 A2</option>
        <option value="3">標準 B1</option>
        <option value="4">応用 B2</option>
      </select>
    </label>

    <label class="field">
      <span>分野</span>
      <select id="f-category"></select>
    </label>

    <label class="field">
      <span>並び</span>
      <select id="f-order">
        <option value="id">収録順</option>
        <option value="alpha">アルファベット順</option>
        <option value="random">ランダム</option>
      </select>
    </label>

    <div class="field">
      <span>範囲</span>
      <div class="range-row">
        <input type="number" id="f-start" min="1" value="1" />
        <span class="range-sep">語目から</span>
        <select id="f-count">
          <option value="20">20語</option>
          <option value="40" selected>40語</option>
          <option value="60">60語</option>
          <option value="100">100語</option>
          <option value="200">200語</option>
        </select>
      </div>
      <div class="range-nav">
        <button type="button" id="f-prev">← 前の分</button>
        <button type="button" id="f-next">次の分 →</button>
      </div>
      <p class="hint" id="range-note"></p>
    </div>

    <!-- 用紙によって効く項目が違うので、効かないものは隠す -->
    <label class="check" id="opt-example">
      <input type="checkbox" id="f-example" />
      <span>例文を入れる</span>
    </label>
    <label class="check" id="opt-answer">
      <input type="checkbox" id="f-answer" checked />
      <span>解答を最後に付ける</span>
    </label>
    <label class="check">
      <input type="checkbox" id="f-phonetic" checked />
      <span>発音記号を入れる</span>
    </label>

    <button class="btn btn-print" id="do-print">🖨 印刷する</button>
    <button class="btn" id="do-shuffle" hidden>組み直す</button>

    <p class="hint" id="page-note"></p>
    <p class="hint muted" id="app-version"></p>
  </aside>

  <!-- ここに出ているものが、そのまま紙になる -->
  <main class="papers" id="papers"></main>
</div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
</body>
</html>
